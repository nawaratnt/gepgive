<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giveaway Checklist</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background-color: #FFF0F5; margin: 0; padding: 16px; color: #333; }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: #fff;
      border: 1.5px solid #FFE4E1;
      border-radius: 16px;
      padding: 12px 8px;
      box-shadow: 0 2px 8px rgba(255,182,193,0.2);
    }
    .stat-title { font-size: 13px; color: #555; margin-bottom: 8px; }
    .stat-count { font-size: 28px; font-weight: bold; color: #4A3B32; line-height: 1; }

    .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(255,182,193,0.3); }
    label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #FFC0CB; border-radius: 12px; outline: none; font-size: 14px; }
    
    .item-card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #FFE4E1; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .item-body { display: flex; gap: 12px; align-items: flex-start; }
    
    /* สไตล์รูปภาพฝั่งซ้ายแบบในตัวอย่าง */
    .item-img { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; border: 1px solid #FFE4E1; flex-shrink: 0; cursor: pointer; }
    .item-content { flex-grow: 1; min-width: 0; }
    .item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .item-title { font-weight: bold; font-size: 16px; color: #333; word-break: break-word; }
    .checkbox { width: 24px; height: 24px; cursor: pointer; accent-color: #FF69B4; }
    .item-url { font-size: 12px; color: #555; text-decoration: none; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; cursor: pointer; }
    
    .btn-group { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .btn-action { border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; text-decoration: none; }
    .btn-link { background: #FFF0F5; color: #D87093; }
    .btn-edit { background: #FFF0F5; color: #BA55D3; }
    .btn-del { background: #fff; color: #888; border: 1px solid #DDD; }
    .completed { text-decoration: line-through; color: #aaa; }
    .loading { text-align: center; color: #FF69B4; font-weight: bold; margin: 20px 0; }
  </style>
</head>
<body>

  <!-- 1. การ์ดสรุปจำนวน -->
  <div class="summary-grid">
    <div class="stat-card">
      <div class="stat-title">ทั้งหมด</div>
      <div class="stat-count" id="countAll">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">เก็บแล้ว</div>
      <div class="stat-count" id="countDone">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">ยังไม่ได้เก็บ</div>
      <div class="stat-count" id="countPending">0</div>
    </div>
  </div>

  <!-- 2. ช่องค้นหา -->
  <div class="card">
    <label>Search Giveaway</label>
    <input type="text" id="searchInput" onkeyup="filterItems()" placeholder="พิมพ์ชื่อ Giveaway ที่ต้องการค้นหา...">
  </div>

  <div id="loading" class="loading">กำลังโหลดข้อมูล...</div>
  <div id="itemsList"></div>

  <p style="text-align: center; font-size: 13px; color: #888; margin-top: 24px;">
    Gep Giveaway Together🎁❤️
  </p>

  <script>
    // ⚠️ ใส่ Web App URL จาก Apps Script ของคุณที่นี่
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwWdXDVbIaYq8Ers2QORMTkqV1hZpTtKze0QhHmAsG9OzvGroCbF00kgqKha3nzrK19/exec"; 
    // ⚠️ ใส่ LIFF ID จาก LINE Developers ของคุณที่นี่
    const LIFF_ID = "2012277521-OkRPjmrd"; 

    let userUserId = "";
    let allItems = [];

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          userUserId = profile.userId;
          loadItems();
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    }
    main();

    async function loadItems() {
      document.getElementById("loading").style.display = "block";
      try {
        const res = await fetch(`${GAS_API_URL}?action=getItems&userId=${encodeURIComponent(userUserId)}`);
        const data = await res.json();
        allItems = data.items || [];
        updateSummary(allItems);
        renderItems(allItems);
      } catch (err) {
        alert("โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้งนะคะ");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    function updateSummary(items) {
      const total = items.length;
      const done = items.filter(item => item.status === "รับแล้ว").length;
      const pending = total - done;

      document.getElementById("countAll").innerText = total;
      document.getElementById("countDone").innerText = done;
      document.getElementById("countPending").innerText = pending;
    }

    function renderItems(items) {
      const listDiv = document.getElementById("itemsList");
      listDiv.innerHTML = "";
      
      if (items.length === 0) {
        listDiv.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">ยังไม่มีรายการในเช็กลิสต์ ลองส่งลิงก์ X/Twitter เข้ามาในแชตดูน้า! ✨</p>';
        return;
      }

      items.forEach(item => {
        const isDone = item.status === "รับแล้ว";
        // รูปภาพพรีวิวถ้าทวีตไม่มีรูป
        const imgUrl = item.imageUrl || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400";

        const html = `
          <div class="item-card">
            <div class="item-body">
              <img src="${imgUrl}" class="item-img" alt="Giveaway Image" onclick="openTweet('${item.tweetUrl}')">
              <div class="item-content">
                <div class="item-header">
                  <span class="item-title ${isDone ? "completed" : ""}">${item.prize}</span>
                  <input type="checkbox" class="checkbox" ${isDone ? "checked" : ""} onchange="toggleStatus(${item.row})">
                </div>
                <div class="item-url" onclick="openTweet('${item.tweetUrl}')">${item.tweetUrl}</div>
                ${item.note ? `<div style="font-size:12px; color:#666; margin-top:6px;">📌 ${item.note}</div>` : ''}
              </div>
            </div>
            <div class="btn-group">
              <button class="btn-action btn-link" onclick="openTweet('${item.tweetUrl}')">เปิดโพสต์ ↗</button>
              <button class="btn-action btn-edit" onclick="editTitle(${item.row}, '${item.prize}')">แก้ไขชื่อ ✎</button>
              <button class="btn-action btn-del" onclick="deleteItem(${item.row})">ลบรายการ</button>
            </div>
          </div>
        `;
        listDiv.innerHTML += html;
      });
    }

    function openTweet(url) {
      if (url) {
        liff.openWindow({ url: url, external: true });
      }
    }

    async function toggleStatus(row) {
      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleStatus", row })
      });
      loadItems();
    }

    async function editTitle(row, currentTitle) {
      const newTitle = prompt("แก้ไขชื่อรายการ/ของแจก:", currentTitle);
      if (newTitle && newTitle !== currentTitle) {
        await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "editTitle", row, newTitle })
        });
        loadItems();
      }
    }

    async function deleteItem(row) {
      if (confirm("คุณต้องการลบรายการนี้ใช่ไหมคะ?")) {
        await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "deleteItem", row })
        });
        loadItems();
      }
    }

    function filterItems() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allItems.filter(item => 
        item.prize.toLowerCase().includes(query) || 
        item.note.toLowerCase().includes(query)
      );
      renderItems(filtered);
    }
  </script>
</body>
</html>
