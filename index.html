<script>
    // ⚠️ 1. ใส่ URL และ anon key จาก Supabase ของคุณ
    const SUPABASE_URL = 'https://qatwqsmxvpkffnuaztmt.supabase.co/rest/v1/'; // เปลี่ยนเป็น URL ของคุณ
    const SUPABASE_ANON_KEY = 'sb_publishable_UYiE1rt673cLg2Brm8K5xw_sBkLgaBH'; // วาง anon key ที่ก๊อปปี้มา
    
    // ⚠️ 2. ใส่ LIFF ID จาก LINE Developers ของคุณ
    const LIFF_ID = "2012277521-OkRPjmrd"; // อันนี้ดึงจากโค้ดเดิมของคุณ

    // เชื่อมต่อ Supabase
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userUserId = "";
    let allItems = [];

    async function main() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          userUserId = profile.userId;
          loadItems();
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
      }
    }
    main();

    // ฟังก์ชันดึงข้อมูลจาก Supabase
    async function loadItems() {
      document.getElementById("loading").style.display = "block";
      try {
        const { data, error } = await supabase
          .from('giveaway_items')
          .select('*')
          .eq('owner_id', userUserId)
          .order('created_at', { ascending: false }); // เรียงจากใหม่ไปเก่า

        if (error) throw error;
        
        allItems = data || [];
        updateSummary(allItems);
        renderItems(allItems);
      } catch (err) {
        console.error(err);
        alert("โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้งนะคะ");
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    }

    // ฟังก์ชันอัปเดตตัวเลขสรุป
    function updateSummary(items) {
      const total = items.length;
      const done = items.filter(item => item.is_done === true).length;
      const pending = total - done;

      document.getElementById("countAll").innerText = total;
      document.getElementById("countDone").innerText = done;
      document.getElementById("countPending").innerText = pending;
    }

    // ฟังก์ชันแสดงผลรายการบนหน้าเว็บ
    function renderItems(items) {
      const listDiv = document.getElementById("itemsList");
      listDiv.innerHTML = "";
      
      if (items.length === 0) {
        listDiv.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">ยังไม่มีรายการในเช็กลิสต์ ลองส่งลิงก์ X/Twitter เข้ามาในแชตดูน้า! ✨</p>';
        return;
      }

      items.forEach(item => {
        const isDone = item.is_done === true;
        // ถ้าระบบหลังบ้านเซฟรูปมาให้ใช้รูปนั้น ถ้าไม่มีใช้รูปพรีวิวเริ่มต้น
        const imgUrl = item.image_url || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400";

        const html = `
          <div class="item-card">
            <div class="item-body">
              <img src="${imgUrl}" class="item-img" alt="Giveaway Image" onclick="openTweet('${item.post_url}')">
              <div class="item-content">
                <div class="item-header">
                  <span class="item-title ${isDone ? "completed" : ""}">${item.title || "ไม่มีชื่อรายการ"}</span>
                  <input type="checkbox" class="checkbox" ${isDone ? "checked" : ""} onchange="toggleStatus(${item.id}, ${isDone})">
                </div>
                <div class="item-url" onclick="openTweet('${item.post_url}')">${item.post_url}</div>
                ${item.note ? `<div style="font-size:12px; color:#666; margin-top:6px;">📌 ${item.note}</div>` : ''}
              </div>
            </div>
            <div class="btn-group">
              <button class="btn-action btn-link" onclick="openTweet('${item.post_url}')">เปิดโพสต์ ↗</button>
              <button class="btn-action btn-edit" onclick="editTitle(${item.id}, '${item.title || ""}')">แก้ไขชื่อ ✎</button>
              <button class="btn-action btn-del" onclick="deleteItem(${item.id})">ลบรายการ</button>
            </div>
          </div>
        `;
        listDiv.innerHTML += html;
      });
    }

    function openTweet(url) {
      if (url) {
        liff.openWindow({ url: url, external: true });
      }
    }

    // ฟังก์ชันเปลี่ยนสถานะ (รับแล้ว/ยังไม่รับ)
    async function toggleStatus(id, currentStatus) {
      await supabase
        .from('giveaway_items')
        .update({ is_done: !currentStatus })
        .eq('id', id);
      loadItems();
    }

    // ฟังก์ชันแก้ไขชื่อรายการ
    async function editTitle(id, currentTitle) {
      const newTitle = prompt("แก้ไขชื่อรายการ/ของแจก:", currentTitle);
      if (newTitle && newTitle !== currentTitle) {
        await supabase
          .from('giveaway_items')
          .update({ title: newTitle })
          .eq('id', id);
        loadItems();
      }
    }

    // ฟังก์ชันลบรายการ
    async function deleteItem(id) {
      if (confirm("คุณต้องการลบรายการนี้ใช่ไหมคะ?")) {
        await supabase
          .from('giveaway_items')
          .delete()
          .eq('id', id);
        loadItems();
      }
    }

    // ฟังก์ชันค้นหา
    function filterItems() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allItems.filter(item => 
        (item.title && item.title.toLowerCase().includes(query)) || 
        (item.note && item.note.toLowerCase().includes(query))
      );
      renderItems(filtered);
    }
  </script>
